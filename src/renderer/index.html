<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gas Station Portal</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         The placeholder in connect-src becomes the origin of RENDERER_VITE_API_BASE_URL at build time
         (build-tools/csp.ts), so the policy always matches the API the app is built for. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
