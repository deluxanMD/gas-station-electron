# Prettier Configuration — Modern Standard Rules
# Aligned with conventions used by Next.js, Vite, Astro, Tailwind, etc.

semi: true
singleQuote: true
tabWidth: 2
useTabs: false
printWidth: 80
trailingComma: all
bracketSpacing: true
bracketSameLine: false
arrowParens: always
endOfLine: lf
jsxSingleQuote: false
quoteProps: as-needed
htmlWhitespaceSensitivity: css
singleAttributePerLine: true
